version: "2"
run:
  timeout: 10m
  modules-download-mode: vendor
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - copyloopvar
    - intrange
    - gosec
    - gocritic
    - revive
    - contextcheck
    - sloglint
    - testifylint
    - unconvert
    - unparam
    - wastedassign
    - nilerr
    - perfsprint
  settings:
    sloglint:
      kv-only: true
    gosec:
      excludes:
        - G101
        - G115
        - G204
        - G304
        - G306
        - G401
        - G501
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - ".*\\.pb\\.go$"
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ".*\\.pb\\.go$"
